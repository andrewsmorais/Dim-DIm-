<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jakash · Sem conexão</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; background: #EEF0FB; color: #1f2040; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #5b5d7a; margin: 0 0 24px; line-height: 1.4; }
  button { background: #5B5BF0; color: #fff; border: 0; border-radius: 999px; padding: 14px 28px; font-weight: 700; font-size: 16px; }
  @media (prefers-color-scheme: dark) { body { background: #0B0B0B; color: #f1f1f5; } p { color: #a0a0b0; } }
</style>
</head>
<body>
  <main>
    <h1>Sem conexão</h1>
    <p>Não deu para abrir o Jakash. Confira sua internet e tente de novo.</p>
    <button type="button" id="retry">Tentar de novo</button>
  </main>
  <script>
    // Volta para o site; se a internet ainda estiver fora, o app mostra esta tela de novo.
    document.getElementById('retry').addEventListener('click', function () {
      window.location.href = 'https://www.jakash.app/login';
    });
  </script>
</body>
</html>
